name: ci-wf
on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronized
  push:
    branches:
      - develop
jobs:
  linting-job:
    runs-on: ubuntu
    steps:
      - name: Welcome Steps            
        run: echo "Welcome to CI Pipeline"
      - name: checkout repository            
        uses: action/checkout@v4
      - name: Lint HTML files            
        run: npx htmlhint "**/*.html"
      - name: Lint CSS files            
        run: npx stylelint "**/*.css"


